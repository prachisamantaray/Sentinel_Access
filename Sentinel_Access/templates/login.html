{% extends "base.html" %}
{% block title %}Login - SentinelAccess{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm border-secondary-subtle mt-5">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-shield-lock-fill text-info" style="font-size: 2.5rem;"></i>
          <h4 class="mt-2 mb-0">SentinelAccess</h4>
          <small class="text-secondary">Adaptive MFA &amp; Threat Detection</small>
        </div>
        <form method="post" action="{{ url_for('auth.login') }}">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" name="username" required autofocus autocomplete="username">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" name="password" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-info w-100 text-white">Sign in</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
