{% extends "base.html" %}
{% block title %}403 Forbidden - SentinelAccess{% endblock %}
{% block content %}
<div class="text-center py-5">
  <i class="bi bi-shield-x text-danger" style="font-size: 3rem;"></i>
  <h3 class="mt-3">403 - Forbidden</h3>
  <p class="text-secondary">Your role does not have permission to access this resource.</p>
  <a href="{{ url_for('dashboard') if session.user_id else url_for('auth.login') }}" class="btn btn-info text-white">
    Back to Dashboard
  </a>
</div>
{% endblock %}
